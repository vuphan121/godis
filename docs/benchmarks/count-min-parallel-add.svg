<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title description">
  <title id="title">Parallel Count-Min Sketch update latency</title>
  <desc id="description">The original global lock averaged 298 nanoseconds per operation. The striped implementation averaged 111 nanoseconds per operation. Whiskers show the minimum and maximum across five runs.</desc>
  <rect width="960" height="410" fill="#ffffff"/>
  <text x="48" y="46" fill="#111827" font-family="Arial, sans-serif" font-size="24" font-weight="600">Parallel Count-Min Sketch updates</text>
  <text x="48" y="74" fill="#4b5563" font-family="Arial, sans-serif" font-size="14">Lower is better · five runs · 16 logical CPUs · 0 allocations/op</text>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="190" y1="104" x2="190" y2="330"/>
    <line x1="385" y1="104" x2="385" y2="330"/>
    <line x1="580" y1="104" x2="580" y2="330"/>
    <line x1="775" y1="104" x2="775" y2="330"/>
    <line x1="892" y1="104" x2="892" y2="330"/>
  </g>
  <g fill="#4b5563" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">
    <text x="190" y="354">0</text>
    <text x="385" y="354">100</text>
    <text x="580" y="354">200</text>
    <text x="775" y="354">300</text>
    <text x="892" y="354">360</text>
    <text x="541" y="384" font-size="14">Latency (ns/op)</text>
  </g>
  <g fill="#111827" font-family="Arial, sans-serif" font-size="15" text-anchor="end">
    <text x="170" y="169">Global lock</text>
    <text x="170" y="279">256 stripes</text>
  </g>
  <rect x="190" y="134" width="581" height="50" rx="4" fill="#94a3b8"/>
  <rect x="190" y="244" width="217" height="50" rx="4" fill="#2563eb"/>
  <g stroke="#111827" stroke-width="2">
    <line x1="670" y1="159" x2="855" y2="159"/>
    <line x1="670" y1="149" x2="670" y2="169"/>
    <line x1="855" y1="149" x2="855" y2="169"/>
    <line x1="390" y1="269" x2="436" y2="269"/>
    <line x1="390" y1="259" x2="390" y2="279"/>
    <line x1="436" y1="259" x2="436" y2="279"/>
  </g>
  <g fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="end">
    <text x="760" y="166">298 ns/op</text>
    <text x="397" y="276">111 ns/op</text>
  </g>
  <text x="48" y="396" fill="#6b7280" font-family="Arial, sans-serif" font-size="12">AMD Ryzen 7 7735HS · Windows/amd64 · Go benchmark harness</text>
</svg>
